[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-seo-audit"
version = "0.1.0"
description = "Audit a local business website for local-SEO and conversion basics, and print a prioritized, plain-English fix list."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ricky1800" }]
keywords = ["seo", "local-seo", "audit", "cli", "small-business", "website"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
]

[project.optional-dependencies]
speedups = [
    "lxml>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-beautifulsoup4>=4.12",
]

[project.scripts]
local-seo-audit = "local_seo_audit.cli:main"

[project.urls]
Homepage = "https://github.com/Ricky1800/local-seo-audit"
Issues = "https://github.com/Ricky1800/local-seo-audit/issues"
Changelog = "https://github.com/Ricky1800/local-seo-audit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/local_seo_audit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["local_seo_audit"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=local_seo_audit --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/local_seo_audit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
